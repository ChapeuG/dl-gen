[project]
name = "dl-gen"
version = "0.1.0"
description = "Gera o ingestion.yml e o projeto PySpark de transformação a partir de um data contract (ODCS) ou DDL"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.40.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "openpyxl>=3.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
aws = ["langchain-aws>=0.2.0"]
ui = ["streamlit>=1.40"]

[project.scripts]
dl-gen = "framework.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framework = ["templates/**/*.j2", "templates/**/*.tpl", "templates/**/*.py", "templates/**/*.scala", "skills/**/*.md", "skills/**/*.txt"]
